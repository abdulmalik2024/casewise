  - generic [ref=e19]:
    - 'heading "New York Official Reports: RSS Feeds" [level=1] [ref=e20]'
    - paragraph [ref=e21]: Official Reports RSS (Really Simple Syndication) feeds offer another way for you to stay current with New York decisional law. Official Reports RSS feeds are updated hourly over the course of each day to ensure that you have access to court decisions as soon as they become available. With RSS, there's no need to continually check our website for updates.
    - paragraph [ref=e22]:
      - text: When you subscribe to an Official Reports RSS feed, information on the most recent decisions for that court will be delivered directly to your web browser. Click the
      - link "RSS links" [ref=e23] [cursor=pointer]:
        - /url: "#rss-links"
      - text: on this page to subscribe to the Official Reports RSS feeds that interest you.
    - paragraph [ref=e25]:
      - text: The Law Reporting Bureau RSS Feeds are compatible with the latest versions of Internet Explorer and Firefox. If you are using Google Chrome or Microsoft Edge, you may need to install a third-party browser extension to subscribe to our RSS Feeds. For mobile devices, you may have to download an application which allows you to read RSS Feeds. Please note that you may be able to subscribe to our RSS Feeds via Microsoft Outlook and other email services. If you have accessibility issues/concerns, please contact us at
      - strong [ref=e26]:
        - link "Reporter@nycourts.gov" [ref=e27] [cursor=pointer]:
          - /url: mailto:reporter@nycourts.gov

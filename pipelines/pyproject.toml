[project]
name = "casewise-pipelines"
version = "0.1.0"
description = "Casewise corpus ingestion pipelines"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "playwright>=1.47",
    "psycopg[binary]>=3.2",
    "pypdf>=6.20.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casewise_pipelines"]

[project.scripts]
ingest-statutes = "casewise_pipelines.statutes.run:main"
bootstrap-statutes = "casewise_pipelines.statutes.web_bootstrap:main"
ingest-caselaw = "casewise_pipelines.caselaw.run:main"
embed-corpus = "casewise_pipelines.embeddings.run:main"
load-deadlines = "casewise_pipelines.deadlines.run:main"
ingest-dhcr = "casewise_pipelines.dhcr.run:main"
backfill-caselaw = "casewise_pipelines.caselaw.backfill:main"
ingest-courtrules = "casewise_pipelines.courtrules.run:main"
build-citation-catalog = "casewise_pipelines.bulkdata.build_catalog:main"
